<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>राजस्व अपील कंप्लायन्स · Compliance Suite</title>
<style>
  :root{
    /* Soft premium theme: light teal + pista + peach */
    --bg:#f5faf6; --card:#fffdfa; --ink:#203433; --muted:#6f817c;
    --brand:#2a7f78; --brand2:#6fb8aa; --green:#5d9f75; --red:#c46f60;
    --amber:#b98a46; --line:#dcece5; --soft:#edf8f1;
    --peach:#fff0e8; --pista:#eef8e7; --tealSoft:#e7f6f4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans","Noto Sans Devanagari","Nirmala UI","Mangal",Arial,sans-serif;
    background:radial-gradient(circle at top left,#fff4ec 0,#f5faf6 34%,#eef9f4 100%);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  header.appbar{background:linear-gradient(120deg,#dff4ef 0%,#eaf8e3 48%,#ffe8dc 100%);color:#234845;
    padding:14px 20px;box-shadow:0 2px 14px rgba(42,127,120,.12);border-bottom:1px solid #cfe8e1;}
  header.appbar .wrap{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;
    align-items:center;justify-content:space-between;}
  header.appbar h1{margin:0;font-size:18px;font-weight:700;}
  header.appbar .sub{font-size:12.5px;opacity:.85;margin-top:2px;}
  header.appbar .meta{font-size:12.5px;opacity:.92;text-align:right;line-height:1.5;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 20px 70px;}
  nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;background:rgba(255,253,250,.92);
    padding:7px;border-radius:12px;border:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 3px 14px rgba(42,127,120,.07);backdrop-filter:blur(8px);}
  nav.tabs button{border:none;background:transparent;color:var(--muted);padding:9px 16px;border-radius:9px;
    font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;}
  nav.tabs button:hover{background:var(--soft);color:var(--brand);}
  nav.tabs button.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 3px 8px rgba(42,127,120,.24);}
  nav.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;}
  .card{background:linear-gradient(180deg,#fffefa 0%,#fffaf5 100%);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(42,127,120,.06);}
  .card h2{margin:0 0 4px;font-size:17px;color:#265f59;}
  .card .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px;}
  .grid{display:grid;gap:14px;} .g2{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr;}}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 4px;}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;
    font-family:inherit;background:#fffefb;color:var(--ink);transition:.15s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(111,184,170,.20);}
  textarea{resize:vertical;min-height:56px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .row > div{flex:1 1 140px;}
  button.btn{border:none;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:inherit;
    font-size:13px;background:linear-gradient(135deg,var(--brand),#4caaa0);color:#fff;transition:.15s;white-space:nowrap;box-shadow:0 2px 6px rgba(42,127,120,.16);}
  button.btn:hover{background:linear-gradient(135deg,#236d67,var(--brand2));transform:translateY(-1px);}
  button.btn.ghost{background:var(--pista);color:#24756e;border:1px solid #d5e9cf;box-shadow:none;}
  button.btn.ghost:hover{background:#e2f3dc;}
  button.btn.green{background:linear-gradient(135deg,#5d9f75,#82bd91);} button.btn.green:hover{background:linear-gradient(135deg,#4f8f66,#73af83);}
  button.btn.red{background:linear-gradient(135deg,#c46f60,#d89384);} button.btn.red:hover{background:linear-gradient(135deg,#ac5d50,#c78072);}
  button.btn.wa{background:linear-gradient(135deg,#57a978,#7dc590);} button.btn.wa:hover{background:linear-gradient(135deg,#4a976a,#70b783);}
  button.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  button.btn.xs{padding:3px 7px;font-size:11px;border-radius:6px;}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .pill.pending{background:#fff0ec;color:var(--red);} .pill.settled{background:#edf8e7;color:var(--green);}
  .pill.partial{background:#fff4df;color:var(--amber);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{color:#55736e;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;background:linear-gradient(180deg,var(--tealSoft),var(--pista));}
  td.num,th.num{text-align:right;} tr:hover td{background:#fbfff7;}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;}
  .muted{color:var(--muted);} .num{font-variant-numeric:tabular-nums;}
  .stat .v{font-size:22px;font-weight:800;} .stat .l{font-size:11.5px;color:var(--muted);font-weight:700;}
  .foot{margin-top:24px;text-align:center;color:var(--muted);font-size:12px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:#234845;color:#fff;
    padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:1000;box-shadow:0 4px 16px rgba(42,127,120,.24);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .danger{color:var(--red);} .ok{color:var(--green);} .hint2{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .searchbox{display:flex;gap:8px;align-items:center;background:#fffefb;border:1px solid var(--line);border-radius:10px;padding:3px 6px 3px 12px;}
  .searchbox input{border:none;background:transparent;box-shadow:none;} .searchbox input:focus{box-shadow:none;border:none;}
  .stepper{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px;}
  .stepper button{border:none;background:var(--soft);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;color:var(--brand);font-weight:700;}
  .stepper button:hover{background:#dff2e8;}
  .stepper input{width:46px;border:none;text-align:center;border-radius:6px;background:#fff;font-size:13.5px;padding:4px 0;}
  .stepper input:focus{box-shadow:none;border:none;background:var(--soft);}

  /* forms */
  .formdoc{background:#fff;color:#000;border:1px solid #999;padding:20px 26px;max-width:790px;margin:0 auto;}
  .formdoc .dochead{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;}
  .formdoc .dochead .t1{font-size:20px;font-weight:700;} .formdoc .dochead .t2{font-size:13.5px;font-weight:600;margin-top:3px;}
  .formdoc .dochead .t3{font-size:12px;margin-top:4px;}
  .formdoc ol{margin:8px 0 0 22px;padding:0;} .formdoc li{margin-bottom:11px;font-size:13.5px;}
  .fill{display:inline-block;border:none;border-bottom:1.4px solid #333;background:transparent;font-family:inherit;font-size:13.5px;padding:1px 4px;min-width:60px;height:23px;border-radius:0;}
  .fill:focus{outline:none;box-shadow:none;border-bottom:2px solid var(--brand);}
  .fill.w10{width:10%;}.fill.w12{width:12%;}.fill.w15{width:15%;}.fill.w20{width:20%;}.fill.w30{width:30%;}.fill.w45{width:45%;}.fill.w60{width:60%;}.fill.w75{width:75%;}.fill.w90{width:90%;}
  input[type="date"].fill{min-width:125px;color:#000;}
  .formdoc.jp1doc{max-width:210mm;}
  .formdoc.jp1doc li{break-inside:avoid;page-break-inside:avoid;}
  .formdoc .sigrow{display:flex;justify-content:space-between;gap:18px;margin-top:20px;} .formdoc .sigrow .blk{min-width:0;flex:1;}
  .nodim{border:none;background:transparent;box-shadow:none;width:100%;padding:2px 4px;font-family:inherit;font-size:13px;}
  .formdoc table.filltbl{width:100%;border-collapse:collapse;margin-top:8px;}
  .formdoc table.filltbl th,.formdoc table.filltbl td{border:1px solid #333;padding:5px;font-size:12px;}
  .formdoc table.filltbl td .fill{width:100%;border:none;border-bottom:1px solid #333;}
  .yn{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;margin-left:8px;vertical-align:middle;flex-wrap:wrap;}
  .yn label{cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:700;color:#000;}
  .yn input{position:absolute;opacity:0;pointer-events:none;}
  .yn .mark{width:25px;height:25px;border:1.8px solid #111;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;line-height:1;background:#fff;color:#000;font-family:Arial,"Noto Sans Devanagari",sans-serif;}
  .yn input:focus + .mark{outline:2px solid rgba(44,108,192,.25);outline-offset:1px;}
  .yn input:checked + .mark.yes::before{content:"✓";color:var(--green);}
  .yn input:checked + .mark.no::before{content:"✕";color:var(--red);}
  .yn input:checked + .mark.na::before{content:"—";color:#333;font-size:22px;}
  .chkbox{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .chkbox input{position:absolute;opacity:0;pointer-events:none;}
  .chkbox .mark{width:25px;height:25px;border:1.8px solid #111;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;line-height:1;background:#fff;color:#000;font-family:Arial,"Noto Sans Devanagari",sans-serif;}
  .chkbox input:focus + .mark{outline:2px solid rgba(44,108,192,.25);outline-offset:1px;}
  .chkbox input:checked + .mark.yes::before{content:"✓";color:var(--green);}
  .chkbox input:checked + .mark.no::before{content:"✕";color:var(--red);}
  .chkbox input:checked + .mark.na::before{content:"—";color:#333;font-size:22px;}
  .jp1tbl{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:8px;}
  .jp1tbl th,.jp1tbl td{border:1px solid #333;padding:6px 5px;font-size:12.5px;vertical-align:middle;}
  .jp1tbl th{text-align:center;background:#f4f4f4;color:#000;font-weight:800;}
  .jp1tbl .sr{width:36px;text-align:center;font-weight:700;}
  .jp1tbl .opt{width:62px;text-align:center;}
  .jp1tbl .q{text-align:left;line-height:1.35;}
  .para{font-size:13.5px;text-align:justify;}

  #printArea{display:none;}
  @media print{
    :root{--brand:#000;--brand2:#000;--green:#000;--red:#000;--amber:#000;--line:#000;--soft:#fff;}
    /* Browser print dialog: choose A4 and 100% scale/default margins. */
    @page{size:A4 portrait;margin:12mm;}
    html,body{width:auto;min-height:auto;background:#fff;}
    body{margin:0 !important;padding:0 !important;background:#fff;color:#000;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;color:#000;width:100%;margin:0;padding:0;}

    /* receipt printing */
    #printArea .preceipt{font-size:13.5px;color:#000;width:100%;margin:0;}
    #printArea .preceipt table{width:100%;border-collapse:collapse;font-size:13px;}
    #printArea .preceipt th,#printArea .preceipt td{border:1px solid #000;padding:6px 8px;}
    #printArea .preceipt th{background:#eee !important;color:#000;}

    /* Official forms: full A4 content area with reasonable page margin */
    #printArea .formdoc{
      width:100%;max-width:none;min-height:272mm;margin:0;
      border:1.25px solid #000;padding:9mm 8mm;box-shadow:none;
      box-sizing:border-box;background:#fff;color:#000;
      display:flex;flex-direction:column;
      font-size:14px;line-height:1.5;
    }
    #printArea .formdoc + .formdoc{break-before:page;page-break-before:always;}
    #printArea .formdoc .dochead{padding-bottom:8px;margin-bottom:10px;border-bottom:1.75px solid #000;break-inside:avoid;page-break-inside:avoid;}
    #printArea .formdoc .dochead .t1{font-size:22px;font-weight:800;line-height:1.2;}
    #printArea .formdoc .dochead .t2{font-size:14px;font-weight:700;}
    #printArea .formdoc .dochead .t3{font-size:12.5px;margin-top:6px;}
    #printArea .formdoc ol{margin-top:8px;}
    #printArea .formdoc li,#printArea .formdoc .para{font-size:14px;line-height:1.5;}
    #printArea .formdoc .sigrow{margin-top:auto;padding-top:12mm;}
    #printArea .formdoc table.filltbl th,#printArea .formdoc table.filltbl td{font-size:13px;padding:6px;}
    #printArea .fill{border-bottom:1.15px solid #000;height:24px;font-size:13.5px;padding:1px 4px;}
    #printArea .nodim{font-size:13.5px;color:#000;}
    #printArea input[type="date"].fill{min-width:112px;}
    #printArea input[type="date"]::-webkit-calendar-picker-indicator{display:none;}

    /* Jodpatra-1: legal table layout using full A4 page, not a narrow middle line */
    #printArea .formdoc.jp1doc{padding:8mm 7mm;}
    #printArea .formdoc.jp1doc .dochead{padding-bottom:7px;margin-bottom:8px;}
    #printArea .jp1tbl{
      flex:1;width:100%;height:100%;border-collapse:collapse;table-layout:fixed;margin:0;
      border:1.25px solid #000;
    }
    #printArea .jp1tbl thead{display:table-header-group;}
    #printArea .jp1tbl tr{break-inside:avoid;page-break-inside:avoid;}
    #printArea .jp1tbl th,#printArea .jp1tbl td{
      border:1px solid #000;padding:3.2mm 2mm;vertical-align:middle;color:#000;
    }
    #printArea .jp1tbl th{font-size:12.5px;font-weight:800;text-align:center;background:#f1f1f1 !important;}
    #printArea .jp1tbl .sr{width:9mm;text-align:center;font-size:12.5px;font-weight:800;}
    #printArea .jp1tbl .q{font-size:13px;line-height:1.38;text-align:left;}
    #printArea .jp1tbl .opt{width:17mm;text-align:center;}
    #printArea .chkbox .mark{width:7.2mm;height:7.2mm;font-size:7mm;border:1.4px solid #000;border-radius:3px;}
    #printArea .chkbox input:checked + .mark.na::before{font-size:6.5mm;}
    #printArea .yn .mark,#printArea .chkbox .mark{print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div>
      <h1>राजस्व अपील कंप्लायन्स · Compliance Suite</h1>
      <div class="sub" id="appbarSub">Billing · Clients · WhatsApp share · Backup · Official forms</div>
    </div>
    <div class="meta" id="appbarMeta"></div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <div id="main"></div>
  <div class="foot">Data saves on this device. Use सेटिंग्ज → Backup for JSON / CSV / PDF copies.</div>
</div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* ==================== STATE ==================== */
const LS_KEY='revenue_appeal_compliance_v2';
function defaultItems(){
  return [
    {id:'files',cat:'Filing',name:'Two Files / Foldable Files',marathi:'फाईल (फोल्डेबल)',unit:'नग',qty:2,price:70,active:true},
    {id:'xerox',cat:'Filing',name:'Xerox Set',marathi:'झेरॉक्स सेट',unit:'सेट',qty:1,price:150,active:true},
    {id:'annx',cat:'जोडपत्र',name:'Annexure / जोडपत्र (Photocopy)',marathi:'जोडपत्र / परिशिष्ट',unit:'प्रत',qty:1,price:100,active:true},
    {id:'jp2',cat:'जोडपत्र',name:'जोडपत्र-२ (सत्यापन नमुना)',marathi:'जोडपत्र-२·सत्यापन',unit:'प्रत',qty:1,price:300,active:true},
    {id:'jp3',cat:'जोडपत्र',name:'जोडपत्र-३ (शपथपत्र)',marathi:'जोडपत्र-३·शपथपत्र',unit:'प्रत',qty:1,price:300,active:true},
    {id:'jp4',cat:'जोडपत्र',name:'जोडपत्र-४ (फेरफार तपशील)',marathi:'जोडपत्र-४·फेरफार',unit:'प्रत',qty:1,price:100,active:true},
    {id:'env',cat:'टपाल',name:'Envelope / आवरण',marathi:'लिफाफा / आवरण',unit:'नग',qty:1,price:10,active:true},
    {id:'ack',cat:'टपाल',name:'Acknowledgement / पावती',marathi:'पावती',unit:'नग',qty:1,price:2,active:true},
    {id:'courtfee',cat:'शुल्क',name:'Court Fee / कोर्ट फी',marathi:'कोर्ट फी (न्याय शुल्क)',unit:'नग',qty:1,price:5,active:true},
    {id:'stamp',cat:'टपाल',name:'Post Stamps / पोस्ट स्टॅम्प',marathi:'पोस्ट स्टॅम्प',unit:'नग',qty:1,price:80,active:true},
    {id:'trav',cat:'इतर',name:'Travelling Charges / वाहतूक खर्च',marathi:'वाहतूक खर्च',unit:'वेळा',qty:1,price:150,active:true},
    {id:'sac',cat:'इतर',name:'SAC / Miscellaneous',marathi:'अन्य / SAC खर्च',unit:'एकूण',qty:1,price:300,active:true}
  ];
}
function defaultState(){
  return {
    settings:{officeName:'',filerName:'',address:'',taluka:'',district:'',phone:'',currency:'₹'},
    items:defaultItems(), clients:[],
    formData:{}, seq:1
  };
}
let state=loadState();
let activeTab='home';
let curClientId=null;
let formClient='draft', curForm='chhani';

function loadState(){
  try{ const raw=localStorage.getItem(LS_KEY);
    if(raw){ const s=JSON.parse(raw); s.settings=Object.assign(defaultState().settings,s.settings||{}); return s; } }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
function uid(p){ return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return (state.settings.currency||'₹')+ (+n||0).toLocaleString('en-IN'); }
function fmtDate(d){ if(!d)return''; const dt=new Date(d); return isNaN(dt)?d:dt.toLocaleDateString('en-GB'); }
function localISODate(d){ const x=new Date(d.getTime()-d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); }
function todayISO(){ return localISODate(new Date()); }
function dateInputValue(v,fallbackToday){
  if(!v)return fallbackToday?todayISO():'';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const dt=new Date(s);
  return isNaN(dt)?(fallbackToday?todayISO():''):localISODate(dt);
}
function todayReadable(){ const d=new Date(); return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2300); }
function findItem(id){ return state.items.find(i=>i.id===id); }
function getClient(id){ return state.clients.find(c=>c.id===id); }
function getFormClient(){ return formClient&&formClient!=='draft'?getClient(formClient):null; }
function clientApplicantText(c){
  if(!c)return '';
  const parts=[];
  if(c.name)parts.push(c.name);
  if(c.mobile)parts.push('मो.: '+c.mobile);
  if(c.email)parts.push('ईमेल: '+c.email);
  return parts.join(', ');
}
function activeItems(){ return state.items.filter(i=>i.active); }
function clientTotals(c){
  let total=0,settled=0; (c.entries||[]).forEach(e=>{ total+=e.amount; if(e.status==='settled')settled+=e.amount; });
  const paid=+c.paid||0, balance=total-paid;
  const status=c.status||(balance<=0&&total>0?'settled':(paid>0?'partial':'pending'));
  return {total,settled,paid,balance,status};
}
function statusLabel(s){ return {pending:'प्रलंबित',partial:'अंशतः',settled:'निकाली'}[s]||s; }

/* ==================== NAV ==================== */
const TABS=[{id:'home',label:'मुख्य / Home'},{id:'forms',label:'फॉर्म / Forms'},{id:'settings',label:'सेटिंग्ज / Settings'}];
function renderTabs(){
  const p=state.clients.filter(c=>clientTotals(c).status==='pending').length;
  document.getElementById('tabs').innerHTML=TABS.map(t=>{
    let dot=''; if(t.id==='home')dot=`<span class="dot" style="background:${p>0?'#ff6b5e':'#2ecc71'}"></span>`;
    return `<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}">${t.label}${dot}</button>`;
  }).join('');

function bindClientEditor(id){
  const c=getClient(id); if(!c)return;
  // detail + paid field (live, no full rerender to keep focus)
  document.querySelectorAll('#main [data-cf]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      c[inp.dataset.cf]=inp.value; c.updatedAt=new Date().toISOString(); save();
      if(inp.dataset.cf==='paid') updateTotals(id);
    });
  });
  // checkbox avail
  document.querySelectorAll('#main [data-avail]').forEach(chk=>chk.addEventListener('change',()=>{setAvail(id,chk.dataset.avail,chk.checked);}));
  // stepper
  document.querySelectorAll('#main [data-minus]').forEach(b=>b.onclick=()=>stepQty(id,b.dataset.minus,-1));
  document.querySelectorAll('#main [data-plus]').forEach(b=>b.onclick=()=>stepQty(id,b.dataset.plus,+1));
  document.querySelectorAll('#main [data-qty]').forEach(inp=>inp.addEventListener('input',()=>setQty(id,inp.dataset.qty,inp.value)));
}
function ensureEntry(cid,iid){
  const c=getClient(cid),i=findItem(iid); if(!c||!i)return null;
  let e=c.entries.find(x=>x.itemId===iid);
  if(!e){ e={itemId:iid,name:i.name,marathi:i.marathi,unit:i.unit,qty:i.qty||1,price:i.price,amount:(i.qty||1)*i.price,status:'pending'}; c.entries.push(e); }
  return e;
}
function setAvail(cid,iid,on){
  const c=getClient(cid); if(!c)return;
  const idx=c.entries.findIndex(x=>x.itemId===iid);
  if(on&&idx<0){ ensureEntry(cid,iid); } else if(!on&&idx>=0){ c.entries.splice(idx,1); }
  c.updatedAt=new Date().toISOString(); save(); render();
}
function setQty(cid,iid,v){
  const c=getClient(cid); if(!c)return; v=Math.max(0,+v||0);
  const e=ensureEntry(cid,iid); if(!e)return;
  e.qty=v; e.amount=v*e.price; c.updatedAt=new Date().toISOString(); save();
  updateTotals(cid); const amt=document.querySelector(`#main [data-amt="${iid}"]`); if(amt)amt.textContent=fmt(e.amount);
}
function stepQty(cid,iid,d){
  const c=getClient(cid); if(!c)return;
  const e=ensureEntry(cid,iid); if(!e)return;
  const q=Math.max(0,(+e.qty||0)+d); setQty(cid,iid,q);
  const qi=document.querySelector(`#main [data-qty="${iid}"]`); if(qi)qi.value=q;
}
function updateTotals(cid){
  const c=getClient(cid); if(!c)return; const t=clientTotals(c);
  const a=document.getElementById('t_total'); if(a)a.value=fmt(t.total);
  const b=document.getElementById('t_balance'); if(b){ b.value=fmt(t.balance<0?0:t.balance); b.className=t.balance>0?'danger':'ok'; }
}

/* -------- receipt image (for WhatsApp) -------- */
function receiptImage(c){
  const s=state.settings,t=clientTotals(c);
  const rows=c.entries||[]; const W=820,pad=26,rowH=34,head=70,th=34,foot=130;
  function colY(y){return y;}
  const H=head+th+rows.length*rowH+foot;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.textBaseline='middle';
  function textFit(str,maxW,font){
    ctx.font=font||'13px "Nirmala UI","Mangal",sans-serif';
    if(ctx.measureText(str).width<=maxW)return str;
    while(str.length>1&&ctx.measureText(str+'…').width>maxW)str=str.slice(0,-1);
    return str+'…';
  }
  // header
  ctx.textAlign='center'; ctx.font='bold 20px "Nirmala UI","Mangal",sans-serif';
  ctx.fillText(s.officeName||'COMPLIANCE RECEIPT',W/2,26);
  ctx.font='bold 15px "Nirmala UI","Mangal",sans-serif';
  ctx.fillText('कंप्लायन्स पावती / COMPLIANCE RECEIPT',W/2,52);
  ctx.strokeStyle='#000'; ctx.beginPath(); ctx.moveTo(pad,66); ctx.lineTo(W-pad,66); ctx.stroke();
  // client block
  ctx.textAlign='left'; ctx.font='13px "Nirmala UI","Mangal",sans-serif';
  ctx.fillText('ग्राहक: '+c.name,pad,84);
  ctx.fillText('अपील/केस: '+(c.caseNo||'-')+'   दिनांक: '+fmtDate(c.appDate),pad,104);
  // table header
  let y=head; const xSr=pad,xIt=pad+60,xQty=W-340,xRate=W-230,xAmt=W-120;
  ctx.font='bold 12px "Nirmala UI","Mangal",sans-serif';
  ctx.fillText('अ.क्र.',xSr,y); ctx.fillText('वस्तू',xIt,y);
  ctx.textAlign='right'; ctx.fillText('प्रमाण',xQty,y); ctx.fillText('दर',xRate,y); ctx.fillText('रक्कम',xAmt,y);
  y+=rowH; ctx.strokeStyle='#ccc'; ctx.beginPath(); ctx.moveTo(pad,y-8); ctx.lineTo(W-pad,y-8); ctx.stroke();
  // rows
  ctx.font='13px "Nirmala UI","Mangal",sans-serif'; ctx.textAlign='left';
  rows.forEach((e,i)=>{
    ctx.fillText(String(i+1),xSr,y);
    ctx.fillText(textFit(e.marathi||e.name,300),xIt,y);
    ctx.textAlign='right'; ctx.fillText(e.qty+' '+e.unit,xQty,y); ctx.fillText('₹'+e.price,xRate,y); ctx.fillText('₹'+e.amount,xAmt,y);
    ctx.textAlign='left'; y+=rowH;
  });
  // totals
  ctx.strokeStyle='#000'; ctx.beginPath(); ctx.moveTo(pad,y-8); ctx.lineTo(W-pad,y-8); ctx.stroke();
  ctx.textAlign='right'; ctx.font='bold 14px "Nirmala UI","Mangal",sans-serif';
  ctx.fillText('एकूण: '+fmt(t.total),xAmt,y);
  ctx.font='13px "Nirmala UI","Mangal",sans-serif'; y+=rowH;
  ctx.fillText('जमा: '+fmt(t.paid),xAmt,y); y+=rowH;
  ctx.fillText('शिल्लक: '+fmt(t.balance<0?0:t.balance),xAmt,y); y+=rowH;
  ctx.fillText('स्थिती: '+statusLabel(t.status),xAmt,y);
  // signature
  ctx.textAlign='center'; ctx.font='12px "Nirmala UI","Mangal",sans-serif';
  ctx.fillText(s.filerName||'सही',W-140,y+18); ctx.fillText('(फिलर / Agent)',W-140,y+34);
  ctx.fillText('Generated '+todayReadable(),W/2,H-24);
  return cv.toDataURL('image/png');
}
async function shareReceiptImage(id){
  const c=getClient(id); if(!c)return;
  try{
    const url=receiptImage(c);
    const blob=await (await fetch(url)).blob();
    const file=new File([blob],'receipt_'+Date.now()+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Compliance Receipt',text:receiptMsg(c,false)}); toast('शेअर झाले'); }
    else{ downloadData(url,'receipt.png','image/png'); toast('इमेज डाउनलोड झाली — WhatsApp मध्ये पाठवा'); }
  }catch(e){ try{ downloadData(receiptImage(c),'receipt.png','image/png'); toast('इमेज डाउनलोड झाली'); }catch(e2){ toast('इमेज तयार झाली नाही'); } }
}
function downloadData(data,name,mime){
  const a=document.createElement('a');
  if(data.startsWith('data:'))a.href=data; else a.href=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

    </div>
    <div style="margin-top:14px;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:6px">Generated ${todayReadable()}</div>
  </div>`;
  printHTML(html);
}
function printHTML(html){
  const a=document.getElementById('printArea');
  a.innerHTML=html;
  preparePrintArea(a);
  window.print();
}
function preparePrintArea(root){
  // Keep date pickers while editing, but print dates in Indian/legal dd/mm/yyyy format.
  root.querySelectorAll('input[type="date"]').forEach(inp=>{
    const v=inp.value;
    try{ inp.type='text'; }catch(e){ inp.setAttribute('type','text'); }
    inp.value=fmtDate(v);
  });
}

  const data=ensureFormData(formClient);
  const bind=(sel2,fn)=>body.querySelectorAll(sel2).forEach(inp=>inp.addEventListener('input',()=>{fn(inp);save();}));
  bind('[data-meta]',i=>{data.meta=data.meta||{};data.meta[i.dataset.meta]=i.value;});

function bindSettings(){
  [['st_office','officeName'],['st_filer','filerName'],['st_addr','address'],['st_tal','taluka'],['st_dist','district'],['st_phone','phone'],['st_cur','currency']].forEach(([id,k])=>{const el=document.getElementById(id); if(el)el.addEventListener('input',()=>{state.settings[k]=el.value;save();});});
  state.items.forEach(i=>{
    const on=document.querySelector(`#main [data-it-on="${i.id}"]`),u=document.querySelector(`#main [data-it-u="${i.id}"]`),
      p=document.querySelector(`#main [data-it-p="${i.id}"]`),q=document.querySelector(`#main [data-it-q="${i.id}"]`);
    if(on)on.addEventListener('change',()=>{i.active=on.checked;save();toast(on.checked?'सक्रिय':'निष्क्रिय');});
    if(u)u.addEventListener('input',()=>{i.unit=u.value;save();});
    if(p)p.addEventListener('input',()=>{i.price=+p.value||0;save();});
    if(q)q.addEventListener('input',()=>{i.qty=Math.max(0,+q.value||0);save();});
  });
}

function exportJson(){ downloadData(JSON.stringify(state,null,2),'revenue_backup_'+todayISO()+'.json','application/json'); toast('JSON बॅकअप घेतला'); }
function exportCSV(){
  let rows=[['Client','Case No','Date','Court','Mobile','Advocate','Item','Qty','Unit','Rate','Amount','Paid','Balance','Status']];
  state.clients.forEach(c=>{const t=clientTotals(c);
    if(!c.entries.length)rows.push([c.name,c.caseNo,c.appDate,c.court,c.mobile,c.advName,'','','','','',t.paid,t.balance,t.status]);
    c.entries.forEach(e=>rows.push([c.name,c.caseNo,c.appDate,c.court,c.mobile,c.advName,e.marathi,e.qty,e.unit,e.price,e.amount,t.paid,t.balance,t.status]));
  });
  const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadData('\uFEFF'+csv,'revenue_backup_'+todayISO()+'.csv','text/csv;charset=utf-8'); toast('CSV (Excel) बॅकअप घेतला');
}
function printReport(){
  const ttl=state.settings.officeName||'कंप्लायन्स रिपोर्ट';

    const items=(c.entries||[]).map(e=>`${e.marathi} ${e.qty}×₹${e.price}=₹${e.amount}`).join('<br>')||'—';
    return `<tr><td>${esc(c.name)}</td><td>${esc(c.caseNo||'—')}</td><td>${fmtDate(c.appDate)}</td><td>${items}</td>

    <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px">

    <table><tr><th>ग्राहक</th><th>केस</th><th>दिनांक</th><th>वस्तू</th><th class="num">एकूण</th><th class="num">भरले</th><th class="num">शिल्लक</th><th>स्थिती</th></tr>
      ${rows||'<tr><td colspan="8" class="empty">अजून ग्राहक नाहीत.</td></tr>'}</table>
  </div>`;
  printHTML(html); toast('प्रिंट डायलॉगमध्ये Save as PDF निवडा');

function importJson(ev){
  const f=ev.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.clients||!s.items)throw 1;
    state=Object.assign(defaultState(),s); state.settings=Object.assign(defaultState().settings,s.settings||{}); save(); render(); toast('डेटा आयात झाला'); }
    catch(e){ toast('अवैध बॅकअप फाईल'); } };
  r.readAsText(f);
}
